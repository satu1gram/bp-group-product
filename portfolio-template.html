let currentLang = 'id';

function setLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;
    document.getElementById('btn-id').classList.toggle('bg-blue-600', lang === 'id');
    document.getElementById('btn-id').classList.toggle('bg-slate-700', lang !== 'id');
    document.getElementById('btn-en').classList.toggle('bg-blue-600', lang === 'en');
    document.getElementById('btn-en').classList.toggle('bg-slate-700', lang !== 'en');
    
    renderContent();
}

    document.getElementById('challenge-content').innerHTML = data.challenge.items
        .map(item => `<p>${item}</p>`).join('');
    
    // Solution
    document.getElementById('solution-title').textContent = data.solution.title;
    document.getElementById('solution-content').innerHTML = data.solution.items
        .map(item => `<p>${item}</p>`).join('');
    
    // Features

    document.getElementById('features-grid').innerHTML = data.features
        .map(feature => `
            <div class="feature-card bg-slate-700/30 border border-slate-600/50 rounded-lg p-6">
                <div class="text-4xl mb-4">${feature.icon}</div>
                <h3 class="text-lg font-bold mb-2">${feature.title}</h3>
                <p class="text-slate-300 text-sm">${feature.desc}</p>
            </div>
        `).join('');
    
    // Role
    document.getElementById('role-title').textContent = data.role.title;
    document.getElementById('role-content').innerHTML = data.role.teams
        .map(team => `
            <div>
                <h3 class="text-lg font-bold mb-4 text-blue-300">${team.name}</h3>
                <ul class="space-y-2 text-slate-200">
                    ${team.items.map(item => `<li class="flex gap-3"><span class="text-blue-400">→</span><span>${item}</span></li>`).join('')}
                </ul>
            </div>
        `).join('');
    
    // Tech Stack
    document.getElementById('tech-title').textContent = data.techStack.title;
    document.getElementById('tech-content').innerHTML = data.techStack.stacks
        .map(stack => `
            <div>
                <h3 class="font-bold text-blue-300 mb-3">${stack.category}</h3>
                <div class="flex flex-wrap gap-2">
                    ${stack.items.map(item => `<span class="px-3 py-1 bg-blue-500/20 border border-blue-400/30 rounded text-sm">${item}</span>`).join('')}

            </div>
        `).join('');
    
    // Metrics
    document.getElementById('metrics-title').textContent = data.metrics.title;
    document.getElementById('metrics-content').innerHTML = data.metrics.items
        .map(item => `<p class="flex gap-3"><span class="text-emerald-400 flex-shrink-0">✓</span><span>${item}</span></p>`)
        .join('');
}
